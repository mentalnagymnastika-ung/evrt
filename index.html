<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMG - Terenski rad vaspitača</title>
    
    <!-- Meta tagovi za mobilnu aplikaciju (Moderna PWA & iOS podrška) -->

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="UMG Asistent">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23059669'/><text x='50' y='65' font-family='sans-serif' font-size='40' font-weight='bold' fill='white' text-anchor='middle'>UMG</text></svg>">
    
    <!-- Tailwind CSS za moderan i responzivan dizajn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome za ikonice -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;950&display=swap" rel="stylesheet">
    
    <!-- Link ka manifestu za PWA instalaciju -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Firebase Compat SDKs za automatsku sinhronizaciju na oblaku (v10.8.0) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Fini klizači za desktop režim */
        @media (min-width: 1024px) {
            .custom-scrollbar::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: #f1f5f9;
                border-radius: 8px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 8px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }
        }

        /* Animacija talasanja aktivnog mikrofona */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen lg:h-screen lg:overflow-hidden select-none">

    <!-- Glavno zaglavlje platforme (Premium svijetli dizajn) -->
    <nav class="bg-white text-slate-800 shadow-sm py-4 px-4 md:px-6 shrink-0 border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto flex flex-row justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('welcome')">
                <div class="bg-emerald-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-black text-xl shadow-md border border-emerald-500/20">
                    UMG
                </div>
                <div>
                    <h1 class="font-black text-base tracking-wide leading-tight text-slate-900">Mentalna Gimnastika</h1>
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Terenski Modul</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Indikator statusa sinhronizacije na oblaku -->
                <div class="text-[9px] font-black px-2.5 py-2 rounded-xl flex items-center gap-1.5 transition-all duration-300" id="sync-status">
                    <i class="fa-solid fa-cloud-slash text-slate-400"></i> Lokalno
                </div>
                <!-- Brzi povratak na Welcome stranu -->
                <button onclick="switchTab('welcome')" id="btn-logout" class="text-xs font-black px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all cursor-pointer border border-slate-200 hidden">
                    <i class="fa-solid fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- OSNOVNI RADNI PROSTOR -->
    <main class="max-w-7xl w-full mx-auto p-4 flex-grow flex flex-col lg:overflow-hidden">

        <!-- ======================================================= -->
        <!--  TAB 0: INDEX STRANA / PORTAL (WELCOME TAB)              -->
        <!-- ======================================================= -->
        <section id="tab-welcome" class="space-y-8 lg:h-full lg:overflow-y-auto custom-scrollbar pb-12 flex flex-col justify-between items-center py-6 flex-grow">
            
            <!-- Brendirani logo i zaglavlje -->
            <div class="text-center max-w-xl space-y-4 my-auto">
                <div class="bg-gradient-to-br from-emerald-500 to-teal-700 text-white w-24 h-24 rounded-[2rem] flex items-center justify-center font-black text-5xl shadow-2xl mx-auto border-2 border-emerald-400/20">
                    UMG
                </div>
                <div class="space-y-1">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight leading-tight">Mentalna Gimnastika</h2>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Sistem za praćenje i analizu razvoja dece</p>
                </div>
            </div>

            <!-- Glavna forma za vaspitače na terenu (Svijetle, premium boje) -->
            <div class="bg-white p-8 rounded-[2rem] border border-slate-200/80 max-w-sm w-full shadow-lg space-y-5">
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Izaberi svoj profil:</label>
                    <select id="welcome-educator-select" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none text-slate-800 shadow-inner">
                        <!-- Popunjava se dinamički -->
                    </select>
                </div>
                <button onclick="loginAsEducator()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-xs transition-all shadow-lg flex items-center justify-center cursor-pointer tracking-wider uppercase">
                    <i class="fa-solid fa-sign-in-alt mr-2 text-sm"></i> Pristupi radu
                </button>
            </div>

            <!-- MINI DISKRETNI FOOTER SA DVE IKONICE -->
            <div class="w-full max-w-sm border-t border-slate-200/80 pt-4 flex flex-col items-center space-y-2">
                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Zaštićene pedagoške i admin sekcije</span>
                <div class="flex justify-center space-x-6">
                    <!-- Ikona 1: P-izveštaj -->
                    <a href="p_izvestaj.html" class="w-11 h-11 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-purple-600 hover:border-purple-500/30 transition-all relative group" title="Otključaj P-izveštaj">
                        <i class="fa-solid fa-graduation-cap text-sm"></i>
                        <span class="absolute -top-1 -right-1 bg-amber-500 text-slate-900 text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-black shadow"><i class="fa-solid fa-lock"></i></span>
                    </a>
                    <!-- Ikona 2: Administracija -->
                    <a href="administracija.html" class="w-11 h-11 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-blue-600 hover:border-blue-500/30 transition-all relative group" title="Otključaj Administraciju">
                        <i class="fa-solid fa-sliders-h text-sm"></i>
                        <span class="absolute -top-1 -right-1 bg-amber-500 text-slate-900 text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-black shadow"><i class="fa-solid fa-lock"></i></span>
                    </a>
                </div>
            </div>
        </section>

        <!-- ======================================================= -->
        <!--  TAB 1: TERENSKI RAD VASPITAČA (DNEVNI UNOS)             -->
        <!-- ======================================================= -->
<section id="tab-field" class="space-y-4 lg:h-full lg:overflow-y-auto custom-scrollbar pb-8 hidden">
            
            <input type="hidden" id="field-class-date">

            <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                <div class="flex items-center space-x-2 text-xs font-bold text-slate-700 flex-grow" id="summary-left-container">
                    <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 border border-emerald-100/60 font-black" id="summary-date">Danas</span>
                    <span class="text-slate-300">|</span>
                    <span class="truncate text-slate-600 flex items-center gap-1" id="summary-info">Učitavanje...</span>
                    <div class="flex items-center space-x-1.5 text-[10px] shrink-0">
                        <span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-xl flex items-center gap-1">P: <span id="header-stat-present" class="font-black">0</span></span>
                        <span class="bg-rose-100 text-rose-800 px-2.5 py-1 rounded-xl flex items-center gap-1">O: <span id="header-stat-absent" class="font-black">0</span></span>
                    </div>
                </div>

                <div class="hidden flex-grow items-center relative" id="inline-search-container">
                    <input type="text" id="global-child-search" oninput="handleGlobalSearch()" placeholder="Pretraži dete..." class="w-full bg-slate-50 text-slate-800 rounded-xl pl-9 pr-8 py-2 text-xs outline-none border border-slate-200 focus:border-emerald-500">
                    <button onclick="toggleInlineSearch(false)" class="absolute right-2.5 top-2.5 text-slate-400"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>

                <div class="flex items-center space-x-2 shrink-0 justify-end">
                    <button onclick="toggleInlineSearch(true)" id="btn-toggle-search" class="bg-slate-100 text-slate-700 w-9 h-9 rounded-xl flex items-center justify-center border border-slate-200"><i class="fa-solid fa-magnifying-glass text-xs"></i></button>
                    <button onclick="toggleSettingsPanel()" class="bg-slate-100 text-slate-700 font-bold px-3 py-1.5 h-9 rounded-xl text-xs flex items-center gap-1.5 border border-slate-200">
                        <i class="fa-solid fa-sliders text-emerald-600"></i> Podesi <i class="fa-solid fa-chevron-down text-[10px]" id="settings-chevron"></i>
                    </button>
                </div>
            </div>

            <div id="settings-collapsible-panel" class="hidden bg-white border border-slate-200 rounded-3xl p-4 grid grid-cols-1 sm:grid-cols-2 gap-4 shadow-inner">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1 flex items-center">
                        <i class="fa-solid fa-user-friends text-emerald-500 mr-1.5"></i> Zamenski vaspitač
                    </label>
                    <select id="field-substitute-select" onchange="changeSubstituteEducator(); updateSummaryBar();" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1 flex items-center">
                        <i class="fa-solid fa-folder-tree text-emerald-500 mr-1.5"></i> Aktivna grupa
                    </label>
                    <select id="field-group-select" onchange="changeActiveGroup(); updateSummaryBar();" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800"></select>
                </div>
                <div class="sm:col-span-2 border-t border-slate-100 pt-3 mt-1 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 flex items-center">
                            <i class="fa-solid fa-message-captions text-emerald-500 mr-1.5"></i> Zapažanja o času i tema
                        </label>
                        <button onclick="startVoiceInput('group-general-note')" class="bg-slate-50 hover:bg-emerald-600 text-slate-505 hover:text-white w-8 h-8 rounded-full flex items-center justify-center transition-all shadow border border-slate-200">
                            <i class="fa-solid fa-microphone text-[10px]" id="mic-group-general-note"></i>
                        </button>
                    </div>
                    <textarea id="group-general-note" rows="3" oninput="updateGroupGeneralNote(this.value); updateSummaryBar();" placeholder="Upiši temu i zapažanja..." class="w-full border border-slate-200 rounded-xl p-3 text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 text-slate-800 placeholder-slate-400"></textarea>
                </div>
            </div>

            <div id="substitute-alert-bar" class="hidden p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-medium"></div>
            <div class="space-y-3" id="children-field-list"></div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2.5 z-50 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm" id="toast-icon"></i>
        <span id="toast-text" class="text-xs font-bold tracking-wide">Učitavanje...</span>
    </div>

    <!-- JAVASCRIPT LOGIKA PORTALA I VASPITAČKOG RADA -->
<script>
        // =================================================================
        // === 1. SIGURNOSNA LICENCA (VREMENSKO ZAKLJUČAVANJE SISTEMA)  ===
        // =================================================================
        const LICENSE_CONFIG = {
            expirationDate: "2026-09-01", 
            clientName: "Predškolska Ustanova klijenta",
            supportContact: "podrska@mentalgimnastika.rs"
        };

        // =================================================================
        // === 2. GLOBALNE DEFINICIJE - STRUKTURA RAZVOJNIH OBLASTI       ===
        // =================================================================
        const areas = [
            { id: 1, name: "Memorija (Radna, Dugotrajna, Kratkotrajna)", short: "Memorija i prisećanje", desc: "Sposobnost skladištenja i pronalaženja informacija.", default: 75, icon: "fa-brain", category: "cognitive" },
            { id: 2, name: "Grafo-motorika i koordinacija oko-ruka", short: "Grafo-motorika", desc: "Preciznost pokreta ruke, držanje olovke i vizuelno-motorna kontrola.", default: 75, icon: "fa-pen-clip", category: "motor" },
            { id: 3, name: "Pažnja i Koncentracija", short: "Fokus i pažnja", desc: "Dužina zadržavanja fokusa na zadatku bez ometanja.", default: 75, icon: "fa-eye", category: "motor" },
            { id: 4, name: "Apstraktno razmišljanje i brzina pronalaženja rešenja", short: "Apstraktna logika", desc: "Sposobnost rešavanja mentalnih zagonetki bez fizičkih objekata.", default: 75, icon: "fa-lightbulb", category: "cognitive" },
            { id: 5, name: "Uočavanje odnosa (asocijativnost i zaključivanje)", short: "Asocijativnost", desc: "Povezivanje uzroka i posledica, pronalaženje sličnosti.", default: 75, icon: "fa-diagram-project", category: "cognitive" },
            { id: 6, name: "Razumevanje složenih pojmova i verbalna komunikacija", short: "Verbalni pojmovi", desc: "Vokabular i verbalno izražavanje kompleksnih ideja.", default: 75, icon: "fa-comments", category: "social" },
            { id: 7, name: "Socijalno i emotivno sazrevanje", short: "Socijalno i emotivno", desc: "Nošenje sa uspehom/neuspehom, empatija prema drugarima.", default: 75, icon: "fa-heart", category: "social" },
            { id: 8, name: "Propriocepcija (usklađenost pokreta tela)", short: "Propriocepcija", desc: "Orijentacija u prostoru, motorička kontrola i kretanje na poligonu.", default: 75, icon: "fa-child-reaching", category: "motor" },
            { id: 9, name: "Logika (verbalna, matematička...)", short: "Matematička logika", desc: "Struktuirano, logičko zaključivanje i razumevanje odnosa.", default: 75, icon: "fa-calculator", category: "cognitive" },
            { id: 10, name: "Serijacija i Klasifikacija", short: "Serijacija i klasifikacija", desc: "Grupisanje po osobinama (boja, oblik) i ređanje po veličini.", default: 75, icon: "fa-arrow-down-short-wide", category: "cognitive" },
            { id: 11, name: "Kreativnost i originalnost rešenja", short: "Kreativnost", desc: "Inovativan pristup igrama i sloboda u stvaranju rešenja.", default: 75, icon: "fa-palette", category: "social" }
        ];

        const categories = {
            cognitive: { 
                name: "Kognitivni razvoj i Logika", 
                colorClass: "bg-blue-50/70 border-blue-100", 
                activeBtnClass: "bg-blue-600 text-white border-transparent", 
                inactiveBtnClass: "bg-white text-blue-600 border-blue-200/50 hover:bg-blue-50/50", 
                textClass: "text-blue-700"
            },
            motor: { 
                name: "Fokus, Pažnja i Motorika", 
                colorClass: "bg-emerald-50/70 border-emerald-100", 
                activeBtnClass: "bg-emerald-600 text-white border-transparent", 
                inactiveBtnClass: "bg-white text-emerald-600 border-emerald-200/50 hover:bg-emerald-50/50", 
                textClass: "text-emerald-700"
            },
            social: { 
                name: "Socijalni, Govorni i Kreativni", 
                colorClass: "bg-purple-50/70 border-purple-100", 
                activeBtnClass: "bg-purple-600 text-white border-transparent", 
                inactiveBtnClass: "bg-white text-purple-600 border-purple-200/50 hover:bg-purple-50/50", 
                textClass: "text-purple-700"
            }
        };

        const ratingLevels = [
            { val: 120, label: "Iznad oček.", title: "120 - Iznad očekivanog (darovitost)", color: "from-purple-600 via-indigo-600 to-cyan-500", text: "text-purple-700", border: "border-purple-200", bg: "bg-purple-50" },
            { val: 100, label: "Odlično", title: "100 - Odlično postignuće", color: "from-indigo-500 to-purple-600", text: "text-indigo-700", border: "border-indigo-200", bg: "bg-indigo-50" },
            { val: 90, label: "Uobičajeno", title: "90 - Uobičajeni nivo", color: "from-emerald-500 to-teal-500", text: "text-emerald-700", border: "border-emerald-200", bg: "bg-emerald-50" },
            { val: 75, label: "Dobro", title: "75 - Dobro u skladu sa uzrastom", color: "from-blue-500 to-cyan-500", text: "text-blue-700", border: "border-blue-200", bg: "bg-blue-50" },
            { val: 50, label: "Podrška", title: "50 - Potrebna dodatna podrška", color: "from-rose-500 to-red-500", text: "text-rose-700", border: "border-rose-200", bg: "bg-rose-50" }
        ];

        // Stanje aplikacije
        let appState = {
            groups: [],
            dailyRecords: {}, 
            educators: []
        };

        let activeGroupId = "";
        let activeEducator = "";
        let activeRecognition = null;
        let originalTextMap = {};
        let expandedChildIds = new Set();
        
        let db = null;
        let auth = null;
        let useCloud = false;
        let appId = 'default-app-id';

        // =================================================================
        // === 3. POMOĆNE FUNKCIJE - PROVERA I DOBIJANJE KLJUČA ZAPISA   ===
        // =================================================================
        function getRecordKey() {
            const dateInput = document.getElementById('field-class-date');
            const date = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
            return `${date}_${activeGroupId}`;
        }

        function checkLicenseExpired() {
            const today = new Date();
            const expirationLimit = new Date(LICENSE_CONFIG.expirationDate);
            return today > expirationLimit;
        }

        function showLicenseExpiredScreen() {
            document.body.className = "bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4 select-none";
            document.body.innerHTML = `
                <div class="bg-white p-8 rounded-3xl border border-slate-200 max-w-md w-full text-center shadow-xl space-y-6">
                    <div class="w-20 h-20 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-3xl border border-rose-100">
                        <i class="fa-solid fa-hourglass-end animate-pulse"></i>
                    </div>
                    <div class="space-y-2">
                        <h2 class="text-xl font-black text-slate-900">Licenca za korišćenje je istekla</h2>
                        <p class="text-xs text-slate-500 leading-relaxed">Pristup aplikaciji UMG Asistent za ustanovu <strong class="text-slate-800">${LICENSE_CONFIG.clientName}</strong> je onemogućen jer je ugovorni ili probni period završen.</p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-xl text-left border border-slate-200 text-[11px] text-slate-500 leading-relaxed font-sans">
                        Za produženje ugovora, tehničku podršku i reizdavanje licenci, molimo kontaktirajte nas direktno putem e-mail adrese.
                    </div>
                    <a href="mailto:${LICENSE_CONFIG.supportContact}" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-md flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-envelope mr-2"></i> Kontaktiraj tehničku podršku
                    </a>
                </div>
            `;
        }

        // INICIJALIZACIJA SISTEMA
        window.addEventListener('DOMContentLoaded', () => {
            if (checkLicenseExpired()) {
                showLicenseExpiredScreen();
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('field-class-date');
            if (dateInput) dateInput.value = today;

            const savedGroups = localStorage.getItem('umg_field_groups');
            if (savedGroups) appState.groups = JSON.parse(savedGroups);

            const savedEducators = localStorage.getItem('umg_field_educators');
            if (savedEducators) appState.educators = JSON.parse(savedEducators);

            const savedRecords = localStorage.getItem('umg_field_records');
            if (savedRecords) appState.dailyRecords = JSON.parse(savedRecords);

            const savedSelectedEducator = localStorage.getItem('umg_active_educator');
            if (savedSelectedEducator && appState.educators.includes(savedSelectedEducator)) {
                activeEducator = savedSelectedEducator;
            } else if (appState.educators.length > 0) {
                activeEducator = appState.educators[0];
            }

            populateEducatorSelects();
            populateGroupSelects(); 
            loadOrCreateDailyRecord();
            
            initFirebaseCloudSync();
            setupPWAAndServiceWorker();
        });

        // PWA GENERATOR SA ZAŠTITOM ZA FILE:// LOKALNI PROTOKOL
        function setupPWAAndServiceWorker() {
            if (window.location.protocol === 'file:') return;
            try {
                const manifest = {
                    "name": "UMG Terenski Asistent",
                    "short_name": "UMG Asistent",
                    "start_url": "index.html",
                    "display": "standalone",
                    "background_color": "#ffffff",
                    "theme_color": "#059669",
                    "description": "Terenski rad za vaspitače Mentalne Gimnastike",
                    "icons": [{ "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23059669'/><text x='50' y='65' font-family='sans-serif' font-size='40' font-weight='bold' fill='white' text-anchor='middle'>UMG</text></svg>", "sizes": "192x192", "type": "image/svg+xml" }]
                };
                const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = URL.createObjectURL(blob);
                document.head.appendChild(link);

                if ('serviceWorker' in navigator) {
                    const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => {});`;
                    const swBlob = new Blob([swCode], {type: 'text/javascript'});
                    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log(err));
                }
            } catch (e) {}
        }

        function initFirebaseCloudSync() {
            try {
                if (typeof __app_id !== 'undefined') appId = __app_id;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    firebase.initializeApp(firebaseConfig);
                    auth = firebase.auth();
                    db = firebase.firestore();
                    useCloud = true;
                    
                    db.enablePersistence().catch(() => {});
                    auth.signInAnonymously().then(() => {
                        updateSyncStatusUI(true);
                        setupFirestoreRealtimeSync();
                    }).catch(() => updateSyncStatusUI(false));
                } else {
                    updateSyncStatusUI(false);
                }
            } catch (e) { updateSyncStatusUI(false); }
        }

        function updateSyncStatusUI(isOnline) {
            const el = document.getElementById('sync-status');
            if (!el) return;
            if (isOnline) {
                el.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-600 animate-pulse"></i> Sinhronizovano`;
                el.className = "text-[9px] font-black px-2.5 py-2 rounded-xl flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 shadow-sm";
            } else {
                el.innerHTML = `<i class="fa-solid fa-cloud-slash text-slate-400"></i> Lokalno`;
                el.className = "text-[9px] font-bold px-2.5 py-2 rounded-xl flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-500";
            }
        }

        function setupFirestoreRealtimeSync() {
            if (!useCloud || !db) return;
            db.doc(`artifacts/${appId}/public/data/system/config`).onSnapshot((doc) => {
                if (doc.exists && doc.data().educators) {
                    appState.educators = doc.data().educators;
                    populateEducatorSelects();
                }
            });
            db.collection(`artifacts/${appId}/public/data/groups`).onSnapshot((snapshot) => {
                let temp = []; snapshot.forEach(d => temp.push(d.data()));
                if (temp.length > 0) {
                    appState.groups = temp;
                    localStorage.setItem('umg_field_groups', JSON.stringify(appState.groups));
                    populateGroupSelects(); loadOrCreateDailyRecord();
                }
            });
            db.collection(`artifacts/${appId}/public/data/dailyRecords`).onSnapshot((snapshot) => {
                let temp = {}; snapshot.forEach(d => temp[d.id] = d.data());
                if (Object.keys(temp).length > 0) {
                    appState.dailyRecords = temp;
                    localStorage.setItem('umg_field_records', JSON.stringify(appState.dailyRecords));
                    loadOrCreateDailyRecord();
                }
            });
        }

        function updateCloudDailyRecord(key, record) {
            if (useCloud && db && auth.currentUser) {
                db.collection(`artifacts/${appId}/public/data/dailyRecords`).doc(key).set(record).catch(() => {});
            }
        }

        // KASKADNE GRUPE (Moje grupe vs Zamene)
        function populateGroupSelects() {
            const fieldSelect = document.getElementById('field-group-select');
            if (!fieldSelect) return;
            fieldSelect.innerHTML = '';
            const myGroups = appState.groups.filter(g => g.educator === activeEducator);
            const otherGroups = appState.groups.filter(g => g.educator !== activeEducator);

            if (myGroups.length > 0) {
                const g = document.createElement('optgroup'); g.label = "Moje grupe";
                myGroups.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.innerText = x.name; g.appendChild(o); });
                fieldSelect.appendChild(g);
            }
            if (otherGroups.length > 0) {
                const g = document.createElement('optgroup'); g.label = "Ostale grupe (Zamena)";
                otherGroups.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.innerText = `${x.name} (${x.educator || 'Nedodeljen'})`; g.appendChild(o); });
                fieldSelect.appendChild(g);
            }
            if (fieldSelect.options.length > 0) {
                if (Array.from(fieldSelect.options).some(o => o.value === activeGroupId)) {
                    fieldSelect.value = activeGroupId;
                } else {
                    activeGroupId = fieldSelect.options[0].value;
                }
            } else { activeGroupId = ""; }
        }

        function populateEducatorSelects() {
            const f = document.getElementById('field-educator-select');
            const w = document.getElementById('welcome-educator-select');
            const pop = (el) => {
                if (!el) return; el.innerHTML = '';
                appState.educators.forEach(x => { const o = document.createElement('option'); o.value = x; o.innerText = x; o.selected = (x === activeEducator); el.appendChild(o); });
            };
            pop(f); pop(w);
        }

        // ISPRAVLJENO: POPUNJAVANJE SAMO STVARNIH ZAMJENSKIH RADNIKA (Bez vlasnika grupe)
        function populateSubstituteSelect(activeGroup) {
            const s = document.getElementById('field-substitute-select');
            if (!s) return; s.innerHTML = '<option value="none">Bez zamene (Vi vodite čas)</option>';
            appState.educators.forEach(x => {
                if (activeGroup.educator && x !== activeGroup.educator) {
                    const o = document.createElement('option'); o.value = x; o.innerText = x; s.appendChild(o);
                }
            });
            const key = getRecordKey(); const r = appState.dailyRecords[key];
            if (r && r.writer && r.writer !== r.educator) s.value = r.writer;
        }

        // RADNI PORTAL KONTROLE
        function loginAsEducator() {
            const s = document.getElementById('welcome-educator-select');
            if (s) {
                activeEducator = s.value; localStorage.setItem('umg_active_educator', activeEducator);
                const f = document.getElementById('field-educator-select'); if (f) f.value = activeEducator;
                const logout = document.getElementById('btn-logout'); if (logout) logout.classList.remove('hidden');
                populateGroupSelects(); loadOrCreateDailyRecord(); switchTab('field');
                showToast(`Prijavljeni ste kao: ${activeEducator}`);
            }
        }

        function changeActiveEducator() {
            const s = document.getElementById('field-educator-select');
            if (s) {
                activeEducator = s.value; localStorage.setItem('umg_active_educator', activeEducator);
                const search = document.getElementById('global-child-search'); if (search) search.value = '';
                populateGroupSelects(); loadOrCreateDailyRecord();
            }
        }

        function changeActiveGroup() {
            const s = document.getElementById('field-group-select');
            if (s) { activeGroupId = s.value; loadOrCreateDailyRecord(); }
        }

        function changeSubstituteEducator() {
            const s = document.getElementById('field-substitute-select'); if (!s) return;
            const key = getRecordKey();
            if (appState.dailyRecords[key]) {
                appState.dailyRecords[key].writer = (s.value === "none") ? appState.dailyRecords[key].educator : s.value;
                saveDailyRecord(false); updateSummaryBar();
                
                const bar = document.getElementById('substitute-alert-bar');
                const txt = document.getElementById('substitute-alert-text');
                const r = appState.dailyRecords[key];
                if (r && r.writer && r.writer !== r.educator) {
                    if (bar && txt) {
                        txt.innerHTML = `Zabeleženo kao <strong>ZAMENA na času</strong>. Glavni vaspitač grupe je <strong>${r.educator}</strong>, a zamenski vaspitač <strong>${r.writer}</strong> unosi podatke.`;
                        bar.classList.remove('hidden');
                    }
                } else if (bar) { bar.classList.add('hidden'); }
            }
        }

        function loadOrCreateDailyRecord() {
            if (!activeGroupId) {
                const c = document.getElementById('children-field-list');
                if (c) c.innerHTML = `<div class="text-center py-8 bg-white rounded-2xl border border-dashed border-slate-200 p-6"><p class="text-xs text-slate-600 font-bold">Nemate dodeljenih grupa u bazi podataka.</p></div>`;
                document.getElementById('header-stat-present').innerText = "0";
                document.getElementById('header-stat-absent').innerText = "0";
                return;
            }
            const key = getRecordKey(); const g = appState.groups.find(x => x.id === activeGroupId); if (!g) return;
            const display = document.getElementById('field-main-educator-display'); if (display) display.innerText = g.educator || "Nedodeljen";

            if (!appState.dailyRecords[key]) {
                const tracking = {}; g.children.forEach(x => { tracking[x.id] = { present: true, score: null, highlightAreas: [], note: "" }; });
                const initialWriter = (g.educator && g.educator !== activeEducator) ? activeEducator : (g.educator || activeEducator);
                appState.dailyRecords[key] = { date: document.getElementById('field-class-date').value, groupId: activeGroupId, groupName: g.name, educator: g.educator || activeEducator, writer: initialWriter, theme: "", generalNote: "", children: tracking };
            }
            document.getElementById('group-general-note').value = appState.dailyRecords[key].generalNote || "";
            populateSubstituteSelect(g);

            const bar = document.getElementById('substitute-alert-bar');
            const txt = document.getElementById('substitute-alert-text');
            const r = appState.dailyRecords[key];
            if (r && r.writer && r.writer !== r.educator && bar && txt) {
                txt.innerHTML = `Zabeleženo kao <strong>ZAMENA na času</strong>. Glavni vaspitač grupe je <strong>${r.educator}</strong>, a zamenski vaspitač <strong>${r.writer}</strong> unosi podatke.`;
                bar.classList.remove('hidden');
            } else if (bar) { bar.classList.add('hidden'); }

            updateSummaryBar(); renderChildrenTrackingList();
        }

        // RENDER DECE I AUTOMATSKA TIHA SINHRONIZACIJA
        function renderChildrenTrackingList() {
            const key = getRecordKey(); const r = appState.dailyRecords[key]; const g = appState.groups.find(x => x.id === activeGroupId);
            const container = document.getElementById('children-field-list'); if (!container || !g || !r) return;
            container.innerHTML = ''; let pres = 0; let abs = 0;

            g.children.forEach(child => {
                const tr = r.children[child.id] || { present: true, score: null, highlightAreas: [], note: "" };
                if (tr.present) pres++; else abs++;
                const card = document.createElement('div'); card.id = `child-card-${child.id}`;

                if (tr.present) {
                    const exp = expandedChildIds.has(child.id);
                    card.className = "bg-white rounded-3xl border border-slate-200/80 shadow-sm transition-all duration-300 overflow-hidden";
                    
                    let ratingHTML = '<div class="flex flex-wrap gap-3 py-1">';
                    ratingLevels.forEach(lvl => {
                        ratingHTML += `<div class="flex flex-col items-center"><button onclick="setQuickScore('${child.id}', ${lvl.val})" class="w-12 h-12 rounded-full border flex items-center justify-center font-black text-xs ${tr.score === lvl.val ? 'bg-gradient-to-r ' + lvl.color + ' text-white border-transparent scale-115' : 'bg-slate-50 text-slate-700 border-slate-200'}">${lvl.val}</button><span class="text-[9px] font-bold mt-1 text-slate-505">${lvl.label}</span></div>`;
                    });
                    ratingHTML += '</div>';

                    let areasHTML = '<div class="grid grid-cols-1 md:grid-cols-3 gap-3.5 mt-2.5">';
                    ['cognitive', 'motor', 'social'].forEach(catKey => {
                        const cat = categories[catKey]; let icons = '';
                        areas.filter(a => a.category === catKey).forEach(a => {
                            icons += `<button onclick="toggleAreaHighlight('${child.id}', ${a.id})" class="w-12 h-12 rounded-full border-2 flex items-center justify-center transition-all ${tr.highlightAreas.includes(a.id) ? cat.activeBtnClass + ' scale-110' : cat.inactiveBtnClass}"><i class="fa-solid ${a.icon}"></i></button>`;
                        });
                        areasHTML += `<div class="p-3.5 rounded-2xl border ${cat.colorClass}"><span class="text-[9px] font-black uppercase ${cat.textClass} mb-2 block">${cat.name}</span><div class="flex flex-wrap gap-2.5">${icons}</div></div>`;
                    });
                    areasHTML += '</div>';

                    card.innerHTML = `
                        <div class="flex items-center justify-between p-3.5 cursor-pointer hover:bg-slate-50/50" onclick="toggleChildCollapse('${child.id}', event)">
                            <div class="flex items-center space-x-3">
                                <div onclick="togglePresence('${child.id}', event)" class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-250 font-bold flex items-center justify-center text-sm shadow-inner">${child.name.charAt(0)}</div>
                                <h4 class="font-bold text-sm text-slate-800">${child.name}</h4>
                            </div>
                            <div class="flex items-center space-x-2"><span class="bg-emerald-100 text-emerald-800 text-[9px] font-black px-2.5 py-1 rounded-full uppercase">Prisutan</span><button class="w-8 h-8 rounded-full text-slate-400" id="chevron-child-${child.id}" style="transform: ${exp ? 'rotate(180deg)' : 'rotate(0deg)'}"><i class="fa-solid fa-chevron-down text-xs"></i></button></div>
                        </div>
                        <div id="details-child-${child.id}" class="${exp ? '' : 'hidden'} border-t border-slate-100 p-4 bg-slate-50/30 space-y-4">
                            <div><span class="block text-[8px] font-bold text-slate-500 mb-2 uppercase">UMG Procena Časa:</span>${ratingHTML}</div>
                            <div><span class="block text-[8px] font-bold text-slate-555 mb-1.5 uppercase">Izražene snage danas:</span>${areasHTML}</div>
                            <div class="relative flex items-center bg-slate-100/50 rounded-xl border border-slate-200 p-2"><input type="text" id="note-child-${child.id}" value="${tr.note || ''}" oninput="updateChildNote('${child.id}', this.value)" placeholder="Upišite opasku..." class="w-full pr-12 pl-3 py-1.5 text-xs bg-transparent border-none outline-none text-slate-800 font-medium"><button onclick="startVoiceInput('note-child-${child.id}', '${child.id}')" class="absolute right-2 bg-white text-slate-500 w-9 h-9 rounded-full flex items-center justify-center border border-slate-200"><i class="fa-solid fa-microphone text-xs" id="mic-note-child-${child.id}"></i></button></div>
                        </div>`;
                } else {
                    card.className = "bg-slate-100 rounded-2xl p-3 shadow-sm border border-slate-200/60 opacity-60";
                    card.innerHTML = `<div class="flex justify-between items-center"><div class="flex items-center space-x-3 cursor-pointer" onclick="togglePresence('${child.id}', event)"><div class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 font-bold flex items-center justify-center text-[10px]">${child.name.charAt(0)}</div><h4 class="font-bold text-xs text-slate-505 line-through">${child.name}</h4></div><span class="bg-rose-100 text-rose-800 border border-rose-200 text-[8px] font-bold px-2 py-0.5 rounded-full uppercase">Odsutan</span></div>`;
                }
                container.appendChild(card);
            });
            const p = document.getElementById('header-stat-present'); const a = document.getElementById('header-stat-absent');
            if (p) p.innerText = pres; if (a) a.innerText = abs;
        }

        function toggleChildCollapse(id, e) {
            if (e.target.closest('button:not([id^="chevron-child"])') || e.target.closest('input') || e.target.closest('.rounded-full')) return;
            const d = document.getElementById(`details-child-${id}`); const c = document.getElementById(`chevron-child-${id}`);
            if (d && c) {
                if (d.classList.contains('hidden')) { d.classList.remove('hidden'); c.style.transform = 'rotate(180deg)'; expandedChildIds.add(id); }
                else { d.classList.add('hidden'); c.style.transform = 'rotate(0deg)'; expandedChildIds.delete(id); }
            }
        }

        function handleGlobalSearch() {
            const q = document.getElementById('global-child-search').value.toLowerCase().trim();
            const g = appState.groups.find(x => x.id === activeGroupId); if (!g) return;
            g.children.forEach(c => {
                const card = document.getElementById(`child-card-${c.id}`);
                if (card) { if (!q || c.name.toLowerCase().includes(q)) card.classList.remove('hidden'); else card.classList.add('hidden'); }
            });
        }

        function togglePresence(id, e) {
            if (e) e.stopPropagation(); const key = getRecordKey();
            if (appState.dailyRecords[key] && appState.dailyRecords[key].children[id]) {
                const curr = appState.dailyRecords[key].children[id].present;
                appState.dailyRecords[key].children[id].present = !curr;
                if (curr === true) { appState.dailyRecords[key].children[id].score = null; appState.dailyRecords[key].children[id].highlightAreas = []; appState.dailyRecords[key].children[id].note = ""; expandedChildIds.delete(id); }
                saveDailyRecord(false); renderChildrenTrackingList();
            }
        }

        // ISPRAVLJENO: UKLONJEN SVI SUVIŠNI KONFLIKTI OKO STARE TEME ČASA
        function setQuickScore(id, score) {
            const key = getRecordKey();
            if (appState.dailyRecords[key] && appState.dailyRecords[key].children[id]) {
                appState.dailyRecords[key].children[id].score = (appState.dailyRecords[key].children[id].score === score) ? null : score;
                saveDailyRecord(false); renderChildrenTrackingList();
            }
        }

        function toggleAreaHighlight(id, areaId) {
            const key = getRecordKey();
            if (appState.dailyRecords[key] && appState.dailyRecords[key].children[id]) {
                let list = appState.dailyRecords[key].children[id].highlightAreas || [];
                appState.dailyRecords[key].children[id].highlightAreas = list.includes(areaId) ? list.filter(x => x !== areaId) : [...list, areaId];
                saveDailyRecord(false); renderChildrenTrackingList();
            }
        }

        function updateChildNote(id, val) {
            const key = getRecordKey(); if (appState.dailyRecords[key] && appState.dailyRecords[key].children[id]) { appState.dailyRecords[key].children[id].note = val; saveDailyRecord(false); }
        }

        function updateGroupGeneralNote(val) {
            const key = getRecordKey(); if (appState.dailyRecords[key]) { appState.dailyRecords[key].generalNote = val; saveDailyRecord(false); }
        }

        function saveDailyRecord(show) {
            const key = getRecordKey();
            if (appState.dailyRecords[key]) {
                localStorage.setItem('umg_field_records', JSON.stringify(appState.dailyRecords));
                updateCloudDailyRecord(key, appState.dailyRecords[key]);
                if (show) showToast("Podaci sinhronizovani!");
            }
        }

        function updateSummaryBar() {
            const select = document.getElementById('field-group-select'); const note = document.getElementById('group-general-note');
            let gVal = (select && select.selectedIndex >= 0) ? select.options[select.selectedIndex].text : '';
            const nVal = note ? note.value.trim() : '';
            const key = getRecordKey(); const r = appState.dailyRecords[key];
            let writer = activeEducator;
            if (r) { writer = r.writer || r.educator || activeEducator; if (r.writer && r.writer !== r.educator) writer += " (Zamena)"; }
            const p = document.getElementById('summary-info'); if (p) p.innerHTML = `👤 <span class="font-bold text-slate-800">${writer}</span> | <i class="fa-solid fa-house text-emerald-600 mr-1.5 ml-1"></i> <span class="font-bold text-slate-800">${gVal || 'Nema grupe'}</span> ${nVal ? ' | 📝 ' + (nVal.length > 25 ? nVal.substring(0, 25) + '...' : nVal) : ''}`;
        }

        function toggleInlineSearch(show) {
            const left = document.getElementById('summary-left-container'); const inline = document.getElementById('inline-search-container');
            const btn = document.getElementById('btn-toggle-search'); const input = document.getElementById('global-child-search');
            if (show) {
                if (left) left.classList.add('hidden'); if (inline) { inline.classList.remove('hidden'); inline.classList.add('flex'); }
                if (btn) btn.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200'); if (input) input.focus();
            } else {
                if (left) left.classList.remove('hidden'); if (inline) { inline.classList.add('hidden'); inline.classList.remove('flex'); }
                if (btn) btn.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-xl flex items-center justify-center border border-slate-200 cursor-pointer";
                if (input) { input.value = ''; handleGlobalSearch(); }
            }
        }

        function toggleSettingsPanel() {
            const p = document.getElementById('settings-collapsible-panel'); const c = document.getElementById('settings-chevron');
            if (p && c) { p.classList.toggle('hidden'); c.style.transform = p.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)'; }
        }

        function startVoiceInput(elementId, childId = null) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { showToast("Pregledač ne podržava glasovni unos.", "warning"); return; }
            const micIcon = document.getElementById(`mic-${elementId}`); const inputField = document.getElementById(elementId);
            if (activeRecognition) { activeRecognition.stop(); activeRecognition = null; resetMicIcons(); return; }
            const rec = new SpeechRecognition(); rec.lang = 'sr-RS'; rec.continuous = true; rec.interimResults = false;
            const originalVal = inputField ? inputField.value : "";

            rec.onstart = () => {
                activeRecognition = rec;
                if (micIcon) { micIcon.className = "fa-solid fa-microphone-lines text-rose-500 animate-pulse"; micIcon.parentElement.classList.add('mic-active', 'border-rose-500/40'); }
                showToast("Slušam glas... Klikni opet za kraj.", "loading");
            };
            rec.onresult = (e) => {
                let trans = ""; for (let i = e.resultIndex; i < e.results.length; ++i) { if (e.results[i].isFinal) trans += e.results[i][0].transcript + " "; }
                if (trans && inputField) {
                    inputField.value = (originalVal ? originalVal.trim() + " " : "") + trans.trim();
                    if (childId) updateChildNote(childId, inputField.value); else updateGroupGeneralNote(inputField.value);
                }
            };
            rec.onerror = () => { resetMicIcons(); };
            rec.onend = () => { activeRecognition = null; resetMicIcons(); showToast("Završen glasovni unos."); };
            rec.start();
        }

        function resetMicIcons() {
            document.querySelectorAll('.mic-active').forEach(m => {
                m.classList.remove('mic-active', 'border-rose-500/40');
                const i = m.querySelector('i'); if (i) i.className = "fa-solid fa-microphone text-slate-400";
            });
        }

        function switchTab(id) {
            document.getElementById('tab-welcome').classList.add('hidden'); document.getElementById('tab-field').classList.add('hidden');
            document.getElementById(`tab-${id}`).classList.remove('hidden');
            if (id === 'welcome') {
                document.getElementById('btn-logout').classList.add('hidden');
                document.body.className = "bg-slate-50 text-slate-800 flex flex-col min-h-screen lg:h-screen lg:overflow-hidden select-none";
            }
        }

        function showToast(text, type = 'success') {
            const toast = document.getElementById('toast'); const icon = document.getElementById('toast-icon'); const textEl = document.getElementById('toast-text');
            if (!toast || !icon || !textEl) return; textEl.innerText = text;
            icon.className = type === 'success' ? "fa-solid fa-circle-check text-emerald-400 text-sm" : (type === 'warning' ? "fa-solid fa-circle-exclamation text-rose-505 text-sm" : "fa-solid fa-circle-notch text-purple-400 text-sm animate-spin");
            toast.classList.remove('translate-y-20', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100');
            if (type !== 'loading') { setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-20', 'opacity-0'); }, 3000); }
        }
    </script>
</body>
</html>
